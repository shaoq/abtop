name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-2022
          - target: aarch64-pc-windows-msvc
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compilation tools (Linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../abtop-${{ matrix.target }}.tar.gz abtop
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../abtop-${{ matrix.target }}.zip abtop.exe
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: abtop-${{ matrix.target }}
          path: |
            abtop-*.tar.gz
            abtop-*.zip

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate installer script
        run: |
          cat > abtop-installer.sh << 'INSTALLER'
          #!/bin/sh
          set -e
          ARCH=$(uname -m)
          OS=$(uname -s)
          case "$OS" in
            Linux)  TARGET="${ARCH}-unknown-linux-gnu" ;;
            Darwin) TARGET="${ARCH}-apple-darwin" ;;
            *) echo "Unsupported OS: $OS"; exit 1 ;;
          esac
          # Normalize architecture
          case "$ARCH" in
            x86_64|amd64)   ARCH="x86_64" ;;
            aarch64|arm64)  ARCH="aarch64" ;;
          esac
          TARGET="${ARCH}-unknown-linux-gnu"
          [ "$OS" = "Darwin" ] && TARGET="${ARCH}-apple-darwin"
          INSTALL_DIR="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "$INSTALL_DIR"
          URL="https://github.com/shaoq/abtop/releases/latest/download/abtop-${TARGET}.tar.gz"
          echo "Downloading abtop for ${TARGET}..."
          curl --proto '=https' --tlsv1.2 -LsSf "$URL" | tar xz -C "$INSTALL_DIR" abtop
          chmod +x "$INSTALL_DIR/abtop"
          echo "abtop installed to $INSTALL_DIR/abtop"
          INSTALLER
      - name: Generate PowerShell installer
        run: |
          cat > abtop-installer.ps1 << 'INSTALLER'
          $ErrorActionPreference = "Stop"
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          if ($arch -match "Arm") { $target = "aarch64-pc-windows-msvc" } else { $target = "x86_64-pc-windows-msvc" }
          $url = "https://github.com/shaoq/abtop/releases/latest/download/abtop-${target}.zip"
          $installDir = if ($env:CARGO_HOME) { Join-Path $env:CARGO_HOME "bin" } else { Join-Path $env:USERPROFILE ".cargo\bin" }
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          $tmp = [System.IO.Path]::GetTempFileName()
          Invoke-WebRequest -Uri $url -OutFile $tmp
          Expand-Archive -Path $tmp -DestinationPath $installDir -Force
          Remove-Item $tmp
          Write-Host "abtop installed to $installDir\abtop.exe"
          INSTALLER
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp abtop-installer.sh artifacts/
          cp abtop-installer.ps1 artifacts/
          gh release create "${{ github.ref_name }}" artifacts/** --title "abtop ${{ github.ref_name }}" --notes "See [README](https://github.com/shaoq/abtop#install) for install instructions."
